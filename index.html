<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="口腔顔面痛・BMSに関する専門家講義と議論をまとめた予備室です。">
  <title>OFP 予備室</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #5b6775;
      --paper: #f7f4ef;
      --panel: #ffffff;
      --line: #d9d2c7;
      --blue: #174a63;
      --blue-dark: #10384b;
      --danger: #b4233a;
      --shadow: 0 14px 40px rgba(23, 32, 42, 0.10);
      font-family: "Yu Gothic", "YuGothic", "Hiragino Sans", Meiryo, system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      line-height: 1.8;
    }

    a {
      color: inherit;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    .panel {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: clamp(24px, 4vw, 36px);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      line-height: 1.24;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(1.45rem, 4vw, 2.1rem);
      line-height: 1.3;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #b9c2cc;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 74, 99, 0.14);
    }

    .form-row {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button,
    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      padding: 9px 16px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    .button-link:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }

    .button-link.secondary,
    button.secondary {
      background: #fff;
      color: var(--blue);
    }

    .button-link.secondary:hover,
    button.secondary:hover {
      background: #eef6f8;
      color: var(--blue-dark);
    }

    .error {
      display: none;
      margin: 10px 0 0;
      color: var(--danger);
      font-weight: 700;
    }

    .locked[aria-hidden="true"],
    .unlocked[aria-hidden="true"] {
      display: none;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      display: flex;
      min-height: 132px;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: #fbfaf7;
      text-decoration: none;
    }

    .card strong {
      display: block;
      color: var(--ink);
      line-height: 1.45;
    }

    .card span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .topline {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border: 1px solid #cce0e5;
      border-radius: 999px;
      padding: 3px 10px;
      background: #eef8fa;
      color: var(--blue);
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    @media (max-width: 760px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .button-row,
      button,
      .button-link {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section id="locked" class="panel locked" aria-hidden="false">
      <span class="topline">Protected</span>
      <h1>予備室（パスワード）</h1>
      <p>
        口腔顔面痛・BMSに関する専門家議論と講義録を収載しています。
      </p>
      <form id="unlock-form" class="form-row">
        <div>
          <label for="password">パスワード</label>
          <input id="password" type="password" autocomplete="current-password">
          <p id="password-error" class="error">パスワードが正しくありません。</p>
        </div>
        <button type="submit">開く</button>
      </form>
    </section>

    <section id="unlocked" class="panel unlocked" aria-hidden="true">
      <span class="topline">OFP 予備室</span>
      <h2>予備室</h2>
      <p>
        専門家会議の整理、口腔顔面痛講義、海外セミナー要約をまとめた補足資料です。
      </p>
      <div class="cards">
        <a class="card" href="aaop2026/video-lecture-guide.html">
          <strong>2026年AAOP総会講演録・和嶋先生慢性疼痛</strong>
          <span>画像ごとの詳細解説つき講演ガイド</span>
        </a>
        <a class="card" href="aaop2026/aaop-report.html">
          <strong>AAOP 50周年記念大会報告</strong>
          <span>学会報告、BoNT-A、現地画像の整理</span>
        </a>
        <a class="card" href="aaop2026/chronic-orofacial-pain.html">
          <strong>慢性口腔顔面痛への私見</strong>
          <span>ICOP、COPCs、痛覚変調性疼痛の解説</span>
        </a>
      </div>
      <div class="button-row">
        <button id="lock-button" class="secondary" type="button">ロック</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var password = 'yuasa2026';
      var storageKey = 'ofp-reserved-room-unlocked';
      var locked = document.getElementById('locked');
      var unlocked = document.getElementById('unlocked');
      var form = document.getElementById('unlock-form');
      var input = document.getElementById('password');
      var error = document.getElementById('password-error');
      var lockButton = document.getElementById('lock-button');

      function setUnlocked(value) {
        locked.setAttribute('aria-hidden', value ? 'true' : 'false');
        unlocked.setAttribute('aria-hidden', value ? 'false' : 'true');
        if (value) {
          sessionStorage.setItem(storageKey, 'true');
        } else {
          sessionStorage.removeItem(storageKey);
          input.value = '';
          error.style.display = 'none';
        }
      }

      if (sessionStorage.getItem(storageKey) === 'true') {
        setUnlocked(true);
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (input.value === password) {
          setUnlocked(true);
          return;
        }
        error.style.display = 'block';
      });

      input.addEventListener('input', function () {
        error.style.display = 'none';
      });

      lockButton.addEventListener('click', function () {
        setUnlocked(false);
      });
    })();
  </script>
</body>
</html>
