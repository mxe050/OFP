<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="口腔顔面痛・BMSに関する専門家講義と議論をまとめたパスワード保護アプリです。" />
    <title>OFP 予備室</title>
  </head>
  <body>
    <div id="root">
      <style>
        :root {
          color: #17202a;
          background: #f7f4ef;
          font-family: "Yu Gothic", "YuGothic", "Hiragino Sans", Meiryo, system-ui, sans-serif;
        }

        body {
          margin: 0;
        }

        .static-launch {
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 32px 16px;
          background: #f7f4ef;
        }

        .static-launch__panel {
          width: min(760px, 100%);
          border: 1px solid #d9d2c7;
          border-radius: 8px;
          background: #fff;
          padding: 28px;
          box-shadow: 0 14px 40px rgba(23, 32, 42, 0.10);
        }

        .static-launch h1 {
          margin: 0 0 12px;
          font-size: clamp(1.6rem, 4vw, 2.4rem);
          line-height: 1.25;
          letter-spacing: 0;
        }

        .static-launch p {
          margin: 0 0 18px;
          color: #4c5966;
          line-height: 1.8;
        }

        .static-launch__actions {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
        }

        .static-launch__actions a {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-height: 44px;
          border: 1px solid #174a63;
          border-radius: 8px;
          padding: 8px 14px;
          color: #fff;
          background: #174a63;
          text-decoration: none;
          font-weight: 700;
        }

        .static-launch__actions a.secondary {
          color: #174a63;
          background: #fff;
        }
      </style>
      <main class="static-launch">
        <section class="static-launch__panel">
          <h1>OFP 予備室</h1>
          <p>
            この画面は、HTMLを直接ダブルクリックしたときの表示です。講演録は下のボタンから開けます。
          </p>
          <div class="static-launch__actions">
            <a href="public/aaop2026/video-lecture-guide.html">2026年AAOP総会講演録・和嶋先生慢性疼痛</a>
            <a class="secondary" href="public/aaop2026/index.html">概要を開く</a>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
